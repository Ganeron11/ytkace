name: Build YTKACE IPA + Extra Tweaks

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file (iOS 17+)"
        required: true
        default: ""
      ipa_url_ios16:
        description: "URL to the decrypted IPA file (iOS 16 — optional, for dual-IPA build)"
        required: false
        default: ""
      display_name:
        description: "App Name (Optional)"
        required: false
        default: "YouTube"
      bundle_id:
        description: "Bundle ID (Optional)"
        required: false
        default: "com.google.ios.youtube"

      # ── Optional tweaks ─────────────────────────────────────────
      open_youtube:
        description: "Integrate Open in YouTube (Safari Extension)"
        required: false
        type: boolean
        default: true
      youpip:
        description: "Integrate YouPiP"
        required: false
        type: boolean
        default: true
      ytuhd:
        description: "Integrate YTUHD [INCOMPATIBLE WITH YOUTUBE VERSIONS 21.25.5 AND HIGHER]"
        required: false
        type: boolean
        default: false
      return_youtube_dislikes:
        description: "Integrate Return YouTube Dislikes"
        required: false
        type: boolean
        default: true
      ytabconfig:
        description: "Integrate YTABConfig"
        required: false
        type: boolean
        default: true
      youquality:
        description: "Integrate YouQuality"
        required: false
        type: boolean
        default: false
      youchoose_quality:
        description: "Integrate YouChooseQuality"
        required: false
        type: boolean
        default: true
      youslider:
        description: "Integrate YouSlider"
        required: false
        type: boolean
        default: true
      ytsilent_vote:
        description: "Integrate YTSilentVote"
        required: false
        type: boolean
        default: true
      ytweaks:
        description: "Integrate YTweaks"
        required: false
        type: boolean
        default: true
      gonerino:
        description: "Integrate Gonerino"
        required: false
        type: boolean
        default: true
      youget_caption:
        description: "Integrate YouGetCaption"
        required: false
        type: boolean
        default: true
      youspeed:
        description: "Integrate YouSpeed"
        required: false
        type: boolean
        default: true
      youmute:
        description: "Integrate YouMute"
        required: false
        type: boolean
        default: true
      youloop:
        description: "Integrate YouLoop"
        required: false
        type: boolean
        default: true
      donteatmycontent:
        description: "Integrate DontEatMyContent"
        required: false
        type: boolean
        default: true
      isponsorblock:
        description: "Integrate iSponsorBlock"
        required: false
        type: boolean
        default: true
      youmod:
        description: "Integrate YouMod"
        required: false
        type: boolean
        default: false
      youpro:
        description: "Integrate YouPro (Optional)"
        required: false
        type: boolean
        default: false
      alderis:
        description: "Integrate Alderis (Color Picker — required for YouSlider)"
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build YTKACE IPA
    runs-on: macos-latest
    permissions:
      contents: write

    env:
      THEOS: ${{ github.workspace }}/theos
      ARTIFACTS: ${{ github.workspace }}/artifacts
      BUILD_DIR: ${{ github.workspace }}/tweak_build
      DISPLAY_NAME: ${{ github.event.inputs.display_name || 'YouTube' }}
      BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.google.ios.youtube' }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout YTKACE source
        uses: actions/checkout@v4

      # ── 2. Theos cache ─────────────────────────────────────────────────────
      - name: Cache Theos
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-macos-${{ hashFiles('Makefile', 'control') }}
          restore-keys: |
            theos-macos-

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        env:
          THEOS: ${{ github.workspace }}/theos
          CI: 1

      # ── 3. Shared headers ──────────────────────────────────────────────────
      - name: Clone shared headers
        run: |
          rm -rf "$THEOS/include/YouTubeHeader" "$THEOS/include/PSHeader"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git      "$THEOS/include/PSHeader"

      # ── 4. Build YTKACE from repo source ───────────────────────────────────
      - name: Build YTKACE
        run: |
          mkdir -p "$ARTIFACTS"
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb "$ARTIFACTS/ytkace.deb"

      # ── 5. Download IPA ────────────────────────────────────────────────────
      - name: Download decrypted IPA (primary)
        run: |
          mkdir -p "${{ github.workspace }}/ipa"
          curl -L --fail --retry 3 --retry-delay 2 \
            -o "${{ github.workspace }}/ipa/youtube.ipa" \
            "${{ github.event.inputs.ipa_url }}"

      - name: Download decrypted IPA (iOS 16 — optional)
        if: ${{ github.event.inputs.ipa_url_ios16 != '' }}
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            -o "${{ github.workspace }}/ipa/youtube_ios16.ipa" \
            "${{ github.event.inputs.ipa_url_ios16 }}"

      # ── 6. Dependency tweaks (always built when any optional tweak is on) ──
      #   YouGroupSettings + YTVideoOverlay are build-time dependencies
      #   for virtually every PoomSmart tweak, so always include them.
      - name: Build YouGroupSettings
        run: |
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouGroupSettings.git
          cd YouGroupSettings
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/yougroupsettings.deb"

      - name: Build YTVideoOverlay
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git
          cd YTVideoOverlay
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/ytvideooverlay.deb"

      # ── 7. Optional tweaks ─────────────────────────────────────────────────

      - name: Build YouPiP
        if: ${{ github.event.inputs.youpip == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouPiP.git
          cd YouPiP
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/youpip.deb"

      - name: Build YTUHD
        if: ${{ github.event.inputs.ytuhd == 'true' }}
        run: |
          cd "$BUILD_DIR"
          # dav1d는 iOS arm64용으로 크로스컴파일 필요
          brew install meson ninja
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTUHD.git
          cd YTUHD
          git submodule update --init --depth=1 vendor/libvpx

          # iOS SDK 경로
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun --sdk iphoneos --find clang)
          CLANGPP=$(xcrun --sdk iphoneos --find clang++)

          # libvpx 빌드
          mkdir -p vendor/libvpx_ios
          cd vendor/libvpx
          ./configure \
            --target=arm64-darwin-gcc \
            --disable-examples --disable-docs --disable-unit-tests \
            --enable-static --disable-shared \
            CC="$CLANG -arch arm64 -isysroot $SDK -mios-version-min=11.0" \
            AR="$(xcrun --sdk iphoneos --find ar)" \
            --prefix="$(pwd)/../../vendor/libvpx_ios"
          make -j$(sysctl -n hw.logicalcpu) install
          cd ../..

          # dav1d 빌드 (meson cross)
          cat > /tmp/dav1d_ios.ini << MESON_EOF
          [binaries]
          c      = ['$CLANG',   '-arch', 'arm64', '-isysroot', '$SDK', '-mios-version-min=11.0']
          cpp    = ['$CLANGPP', '-arch', 'arm64', '-isysroot', '$SDK', '-mios-version-min=11.0']
          ar     = '$(xcrun --sdk iphoneos --find ar)'
          strip  = '$(xcrun --sdk iphoneos --find strip)'

          [built-in options]
          c_args   = ['-mios-version-min=11.0']
          cpp_args = ['-mios-version-min=11.0']

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system     = 'darwin'
          subsystem  = 'ios'
          kernel     = 'xnu'
          cpu_family = 'aarch64'
          cpu        = 'aarch64'
          endian     = 'little'
          MESON_EOF

          git clone --quiet --depth=1 https://github.com/videolan/dav1d.git /tmp/dav1d_src
          meson setup /tmp/dav1d_build /tmp/dav1d_src \
            --cross-file=/tmp/dav1d_ios.ini \
            --default-library=static \
            --prefix="$(pwd)/vendor/dav1d_ios/install" \
            -Denable_tools=false -Denable_tests=false \
            -Denable_examples=false -Dlogging=false
          meson compile -C /tmp/dav1d_build
          meson install -C /tmp/dav1d_build --no-rebuild

          cp "$(find vendor/dav1d_ios/install -name 'libdav1d.a' | head -1)" \
             vendor/dav1d_ios/libdav1d.a
          mkdir -p vendor/dav1d
          cp -R vendor/dav1d_ios/install/include vendor/dav1d/include

          make clean package DEBUG=0 FINALPACKAGE=1 SIDELOAD=1
          cp packages/*.deb "$ARTIFACTS/ytuhd.deb"

      - name: Build Return YouTube Dislikes
        if: ${{ github.event.inputs.return_youtube_dislikes == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git
          cd Return-YouTube-Dislikes
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/ryd.deb"

      - name: Build YTABConfig
        if: ${{ github.event.inputs.ytabconfig == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTABConfig.git
          cd YTABConfig
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/ytabconfig.deb"

      - name: Build YouQuality
        if: ${{ github.event.inputs.youquality == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouQuality.git
          cd YouQuality
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/youquality.deb"

      - name: Build YouChooseQuality
        if: ${{ github.event.inputs.youchoose_quality == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/Tonwalter888/YouChooseQuality.git
          cd YouChooseQuality
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/youchoose.deb"

      - name: Build YouSlider
        if: ${{ github.event.inputs.youslider == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouSlider.git
          cd YouSlider
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/youslider.deb"

      - name: Download Alderis (pre-built)
        # Alderis는 소스 빌드보다 공식 릴리즈 .deb를 사용하는 것이 안정적
        if: ${{ github.event.inputs.alderis == 'true' || github.event.inputs.youslider == 'true' }}
        run: |
          ALDERIS_URL=$(curl -s https://api.github.com/repos/hbang/Alderis/releases/latest \
            | grep "browser_download_url.*\.deb" | grep -v "rootless\|roothide" \
            | head -1 | cut -d '"' -f4)
          if [ -z "$ALDERIS_URL" ]; then
            # fallback: rootless 버전 사용
            ALDERIS_URL=$(curl -s https://api.github.com/repos/hbang/Alderis/releases/latest \
              | grep "browser_download_url.*\.deb" | head -1 | cut -d '"' -f4)
          fi
          curl -L --fail --retry 3 -o "$ARTIFACTS/alderis.deb" "$ALDERIS_URL"

      - name: Build YTSilentVote
        if: ${{ github.event.inputs.ytsilent_vote == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTSilentVote.git
          cd YTSilentVote
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/ytsilentvote.deb"

      - name: Build YTweaks
        if: ${{ github.event.inputs.ytweaks == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/fosterbarnes/YTweaks.git
          cd YTweaks
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/ytweaks.deb"

      - name: Build Gonerino
        if: ${{ github.event.inputs.gonerino == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/castdrian/Gonerino.git
          cd Gonerino
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/gonerino.deb"

      - name: Build YouGetCaption
        if: ${{ github.event.inputs.youget_caption == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouGetCaption.git
          cd YouGetCaption
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/yougetcaption.deb"

      - name: Build YouSpeed
        if: ${{ github.event.inputs.youspeed == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouSpeed.git
          cd YouSpeed
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/youspeed.deb"

      - name: Build YouMute
        if: ${{ github.event.inputs.youmute == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouMute.git
          cd YouMute
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/youmute.deb"

      - name: Build YouLoop
        if: ${{ github.event.inputs.youloop == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/bhackel/YouLoop.git
          cd YouLoop
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/youloop.deb"

      - name: Build DontEatMyContent
        if: ${{ github.event.inputs.donteatmycontent == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/therealFoxster/DontEatMyContent.git
          # DEMC 는 헤더 선언 패치 필요
          sed -i '' "s/^CGFloat constant;/extern CGFloat constant;/" DontEatMyContent/Tweak.h
          sed -i '' "0,/^static CGFloat videoAspectRatio/s//CGFloat constant = 0.0;\nstatic CGFloat videoAspectRatio/" DontEatMyContent/Tweak.x
          cd DontEatMyContent
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/demc.deb"

      - name: Build iSponsorBlock
        if: ${{ github.event.inputs.isponsorblock == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/Galactic-Dev/iSponsorBlock.git
          cd iSponsorBlock
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/isponsorblock.deb"

      - name: Build YouMod
        if: ${{ github.event.inputs.youmod == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet --depth=1 https://github.com/Tonwalter888/YouMod.git
          cd YouMod
          make clean package DEBUG=0 FINALPACKAGE=1
          cp packages/*.deb "$ARTIFACTS/youmod.deb"

      - name: Download YouPro (pre-built release)
        # YouPro는 릴리즈 .deb로 배포됨
        if: ${{ github.event.inputs.youpro == 'true' }}
        run: |
          YOUPRO_URL=$(curl -s https://api.github.com/repos/mrdrvt99/YouPro/releases/latest \
            | grep "browser_download_url.*\.deb" | head -1 | cut -d '"' -f4)
          curl -L --fail --retry 3 -o "$ARTIFACTS/youpro.deb" "$YOUPRO_URL"

      - name: Download Open in YouTube Safari Extension
        if: ${{ github.event.inputs.open_youtube == 'true' }}
        run: |
          cd "$BUILD_DIR"
          git clone --quiet -n --depth=1 --filter=tree:0 \
            https://github.com/BillyCurtis/OpenYouTubeSafariExtension OpenYoutubeSafariExtension
          cd OpenYoutubeSafariExtension
          git sparse-checkout set --no-cone \
            OpenYouTubeSafariExtension.appex OpenYoutubeSafariExtension.appex
          git checkout --quiet
          find . -maxdepth 1 -type d -name "*.appex" \
            -exec cp -R {} "$ARTIFACTS/" \;

      # ── 8. Install pyzule (cyan) ───────────────────────────────────────────
      - name: Install pyzule (cyan)
        run: |
          pip3 install --user lief
          pip3 install --user --force-reinstall \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      # ── 9. Inject tweaks into IPA ──────────────────────────────────────────
      - name: Collect tweak list
        id: tweaks
        run: |
          TWEAKS=()
          for f in "$ARTIFACTS"/*.deb; do
            [ -f "$f" ] && TWEAKS+=("$f")
          done
          for d in "$ARTIFACTS"/*.appex; do
            [ -d "$d" ] && TWEAKS+=("$d")
          done
          echo "list=${TWEAKS[*]}" >> "$GITHUB_OUTPUT"

      - name: Inject into primary IPA
        run: |
          cyan \
            -i "${{ github.workspace }}/ipa/youtube.ipa" \
            -o "${{ github.workspace }}/ipa/out_primary.ipa" \
            -uwef ${{ steps.tweaks.outputs.list }} \
            -n "$DISPLAY_NAME" \
            -b "$BUNDLE_ID"

      - name: Inject into iOS 16 IPA (if provided)
        if: ${{ github.event.inputs.ipa_url_ios16 != '' }}
        run: |
          cyan \
            -i "${{ github.workspace }}/ipa/youtube_ios16.ipa" \
            -o "${{ github.workspace }}/ipa/out_ios16.ipa" \
            -uwef ${{ steps.tweaks.outputs.list }} \
            -n "$DISPLAY_NAME" \
            -b "$BUNDLE_ID"

      # ── 10. Create GitHub release ──────────────────────────────────────────
      - name: Get YTKACE version
        id: version
        run: |
          VER=$(grep -E "^Version:" control | head -1 | awk '{print $2}')
          echo "ytkace_version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}-$(date +'%Y%m%d%H%M')" >> "$GITHUB_OUTPUT"

      - name: Rename output IPAs
        run: |
          mv "${{ github.workspace }}/ipa/out_primary.ipa" \
             "${{ github.workspace }}/ipa/YTKACE_${{ steps.version.outputs.ytkace_version }}.ipa"
          if [ -f "${{ github.workspace }}/ipa/out_ios16.ipa" ]; then
            mv "${{ github.workspace }}/ipa/out_ios16.ipa" \
               "${{ github.workspace }}/ipa/YTKACE_${{ steps.version.outputs.ytkace_version }}_iOS16.ipa"
          fi

      - name: Upload IPA as release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "YTKACE ${{ steps.version.outputs.ytkace_version }}"
          draft: true
          files: |
            ${{ github.workspace }}/ipa/*.ipa
